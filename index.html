<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TalentMatch - Lightweight tech job search aggregator and explainable candidate-matching platform. Project ID: PST_PD_005." />
  <title>TalentMatch — Explainable Job Matching & Candidate Review</title>

  <!-- Bootstrap 5.3.3 CSS via CDN -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <!-- Bootstrap Icons 1.11.3 CDN -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Keyboard accessibility skip link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Sticky Semantic Navbar Header -->
  <header id="navbar-container" role="banner"></header>

  <!-- Main Content Landmark -->
  <main id="main-content" class="container my-3" tabindex="-1">
    <div id="app-root">
      <div class="text-center py-5" role="status">
        <div class="spinner-border text-primary mb-3" role="status">
          <span class="visually-hidden">Loading TalentMatch…</span>
        </div>
        <p class="text-muted fw-medium">Initializing TalentMatch platform…</p>
      </div>
    </div>
  </main>

  <!-- Semantic Platform Footer -->
  <footer id="footer-container" role="contentinfo"></footer>

  <!-- System Toast Alert Region -->
  <div id="toast-container" class="toast-container-custom" aria-live="polite" aria-atomic="true"></div>

  <!-- Dynamic Modal Region -->
  <div id="modal-container"></div>

  <!-- Bootstrap 5.3.3 Bundle with Popper via CDN -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>

  <!-- Application Script -->
  <script src="./app.js"></script>
</body>
</html>
